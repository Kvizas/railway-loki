auth_enabled: false

server:
  http_listen_port: 3100

limits_config:
  volume_enabled: true
  allow_structured_metadata: true

schema_config:
  configs:
    - from: 2023-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h